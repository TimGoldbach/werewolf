packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@nestjs/core': true
  # Native binaries come prebuilt (next-intl's message extractor, nest/tsup); no build step needed.
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': false
  esbuild: true
  prisma: true
  unrs-resolver: true

# Security fixes for transitive dependencies that their parents pin to vulnerable versions
# (@nestjs/platform-express 10 pins express/body-parser/multer, Next 15 pins postcss,
# @nestjs/cli 10 pins glob/picomatch/tmp, @nestjs/config 3 pins lodash). All are drop-in
# bumps (tmp 0.2 keeps the tmpNameSync that @nestjs/cli's external-editor uses); drop an
# entry once its parent ships the fix itself.
overrides:
  ajv@>=8 <8.18.0: ^8.18.0
  body-parser@1: ^1.20.9
  express@4: ^4.22.3
  glob@>=10 <10.5.0: ^10.5.0
  lodash@4: ^4.18.1
  multer@2: ^2.5.0
  picomatch@>=4 <4.0.4: ^4.0.4
  postcss@<8.5.18: ^8.5.18
  tmp@<0.2.6: ^0.2.6
