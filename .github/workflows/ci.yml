name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @werewolf/api exec prisma generate
      # turbo builds @werewolf/shared first (^build) and caches it within the job.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: werewolf
          POSTGRES_PASSWORD: werewolf
          POSTGRES_DB: werewolf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U werewolf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://werewolf:werewolf@localhost:5432/werewolf?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production applies migrations when the API starts; check them on an empty database first.
      - name: Apply migrations to an empty database
        run: pnpm --filter @werewolf/api exec prisma migrate deploy
      - name: Check that schema.prisma has no missing migration
        run: |
          pnpm --filter @werewolf/api exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          || { echo "::error::schema.prisma differs from the migrations – did you forget 'pnpm --filter @werewolf/api prisma:migrate'?"; exit 1; }

  self-hosting:
    name: Self-hosting (CLI setup, backup, restore, uninstall)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUP_PASSWORD: ci-full-moon-42
    steps:
      - uses: actions/checkout@v7
      # Only Node: the launcher has to install the CLI's dependencies on its own, like on a fresh server.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up a LAN instance non-interactively
        run: ./werewolf setup --mode lan --port 8080 --name "CI Pack" --tagline "Every night" --accent forest --lang en --time-zone Europe/Berlin --password "$GROUP_PASSWORD" --build --yes
      - name: The app answers and the password works
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/login
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"password":"wrong-password"}' http://127.0.0.1:8080/api/auth/login)
          [ "$code" = 401 ] || { echo "::error::wrong password returned $code"; exit 1; }
          curl --fail --silent --show-error --cookie-jar cookies.txt -H 'Content-Type: application/json' \
            -d "{\"password\":\"$GROUP_PASSWORD\"}" http://127.0.0.1:8080/api/auth/login
          curl --fail --silent --show-error --cookie cookies.txt http://127.0.0.1:8080/api/auth/session | grep -q '"authenticated":true'
      - name: Status
        run: ./werewolf status
      - name: Back up, delete a game, restore it
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8080/api
          json=(-H 'Content-Type: application/json')
          curl --fail --silent --show-error --cookie-jar cookies.txt "${json[@]}" \
            -d "{\"password\":\"$GROUP_PASSWORD\"}" "$api/auth/login" >/dev/null
          ids=()
          for name in Ada Bea Cem; do
            ids+=("$(curl --fail --silent --show-error --cookie cookies.txt "${json[@]}" \
              -d "{\"displayName\":\"$name\"}" "$api/players" | jq -r .id)")
          done
          game_body=$(jq -n --arg a "${ids[0]}" --arg b "${ids[1]}" --arg c "${ids[2]}" '{
            winningCondition: "village",
            players: [
              { playerId: $a, roleId: "werewolf", isWinner: false },
              { playerId: $b, roleId: "villager", isWinner: true },
              { playerId: $c, roleId: "seer", isWinner: true }
            ]
          }')
          game=$(curl --fail --silent --show-error --cookie cookies.txt "${json[@]}" -d "$game_body" \
            "$api/games/quick" | jq -r .id)

          ./werewolf backup
          backup=$(ls -t instance/backups/manual-*.sql.gz | head -1)

          curl --fail --silent --show-error --cookie cookies.txt -X DELETE "$api/games/$game" >/dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie cookies.txt "$api/games/$game")
          [ "$code" = 404 ] || { echo "::error::deleted game still answers $code"; exit 1; }

          ./werewolf restore --file "$backup" --yes
          curl --fail --silent --show-error --cookie cookies.txt "$api/games/$game" | jq -e --arg id "$game" '.id == $id'
      - name: Stop
        run: ./werewolf stop
      - name: Uninstall keeps a backup and removes the containers
        run: |
          set -euo pipefail
          ./werewolf uninstall --yes
          ls -l instance/backups/pre-uninstall-*.sql.gz
          [ -z "$(docker compose ps --all --quiet)" ] || { echo "::error::containers left"; exit 1; }
          if docker volume inspect werewolf_pgdata >/dev/null 2>&1; then
            echo "::error::database volume left"; exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 || true
