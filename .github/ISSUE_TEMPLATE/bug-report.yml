name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a live game with 8 players
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer of every page, e.g. v1.2.0.
  - type: dropdown
    id: setup
    attributes:
      label: Where does it run?
      options:
        - Self-hosted with Docker Compose
        - Local development
        - Other
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Error messages from the browser console or `docker compose logs api web`, if any.
      render: shell
